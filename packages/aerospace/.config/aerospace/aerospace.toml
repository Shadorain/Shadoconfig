# Config version for compatibility and deprecations
# Fallback value (if you omit the key): config-version = 1
config-version = 2

# You can use it to add commands that run after AeroSpace startup.
# Available commands : https://nikitabobko.github.io/AeroSpace/commands
after-startup-command = [
    # JankyBorders has a built-in detection of already running process,
    # so it won't be run twice on AeroSpace restart
    # 'exec-and-forget borders active_color=0xAAbd93f9 inactive_color=0xAA35355E width=5.0',
]

# Notify Sketchybar about workspace change
exec-on-workspace-change = [
    '/bin/bash',
    '-c',
    'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE PREVIOUS_WORKSPACE=$AEROSPACE_PREV_WORKSPACE',
]


# Start AeroSpace at login
start-at-login = true

# Normalizations. See: https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = true                         # NOTE: Could set this to false to fix ticktick issues?
enable-normalization-opposite-orientation-for-nested-containers = true

# See: https://nikitabobko.github.io/AeroSpace/guide#layouts
# The 'accordion-padding' specifies the size of accordion padding
# You can set 0 to disable the padding feature
accordion-padding = 15

# Possible values: tiles|accordion
default-root-container-layout = 'tiles'

# Possible values: horizontal|vertical|auto
# 'auto' means: wide monitor (anything wider than high) gets horizontal orientation,
#               tall monitor (anything higher than wide) gets vertical orientation
default-root-container-orientation = 'auto'

# Mouse follows focus when focused monitor changes
# Drop it from your config, if you don't like this behavior
# See https://nikitabobko.github.io/AeroSpace/guide#on-focus-changed-callbacks
# See https://nikitabobko.github.io/AeroSpace/commands#move-mouse
# Fallback value (if you omit the key): on-focused-monitor-changed = []
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# You can effectively turn off macOS "Hide application" (cmd-h) feature by toggling this flag
# Useful if you don't use this macOS feature, but accidentally hit cmd-h or cmd-alt-h key
# Also see: https://nikitabobko.github.io/AeroSpace/goodies#disable-hide-app
automatically-unhide-macos-hidden-apps = true

# List of workspaces that should stay alive even when they contain no windows,
# even when they are invisible.
# This config version is only available since 'config-version = 2'
# Fallback value (if you omit the key): persistent-workspaces = []
persistent-workspaces = [
    "1",
    "2",
    "3",
    "4",
    "5",
    "A", # AI (Claude/Codex)
    "E", # Finder
    "W", # Windows App
    "N", # Notes
    "B", # Browser
    "D", # Development
    "S", # Session
    "T", # Todoist
    "Z", # Extra
]

# A callback that runs every time binding mode changes
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
# See: https://nikitabobko.github.io/AeroSpace/commands#mode
on-mode-changed = []

# Possible values: (qwerty|dvorak|colemak)
# See https://nikitabobko.github.io/AeroSpace/guide#key-mapping
[key-mapping]
preset = 'qwerty'

# Gaps between windows (inner-*) and between monitor edges (outer-*).
# Possible values:
# - Constant:     gaps.outer.top = 8
# - Per monitor:  gaps.outer.top = [{ monitor.main = 16 }, { monitor."some-pattern" = 32 }, 24]
#                 In this example, 24 is a default value when there is no match.
#                 Monitor pattern is the same as for 'workspace-to-monitor-force-assignment'.
#                 See:
#                 https://nikitabobko.github.io/AeroSpace/guide#assign-workspaces-to-monitors
[gaps]
inner.horizontal = 10
inner.vertical = 10
outer.left = 2
outer.bottom = 2
outer.top = 2
outer.right = 2

# 'main' binding mode declaration
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
# 'main' binding mode must be always presented
# Fallback value (if you omit the key): mode.main.binding = {}
[mode.main.binding]

# All possible keys:
# - Letters.        a, b, c, ..., z
# - Numbers.        0, 1, 2, ..., 9
# - Keypad numbers. keypad0, keypad1, keypad2, ..., keypad9
# - F-keys.         f1, f2, ..., f20
# - Special keys.   minus, equal, period, comma, slash, backslash, quote, semicolon,
#                   backtick, leftSquareBracket, rightSquareBracket, space, enter, esc,
#                   backspace, tab, pageUp, pageDown, home, end, forwardDelete,
#                   sectionSign (ISO keyboards only, european keyboards only)
# - Keypad special. keypadClear, keypadDecimalMark, keypadDivide, keypadEnter, keypadEqual,
#                   keypadMinus, keypadMultiply, keypadPlus
# - Arrows.         left, down, up, right

# All possible modifiers: cmd, alt, ctrl, shift

# All possible commands: https://nikitabobko.github.io/AeroSpace/commands

# == Applications ==
alt-shift-enter = "exec-and-forget $HOME/.local/bin/new_ghostty"

# == Layout ==
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'

# == Focus ==
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# == Move ==
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# == Resize ==
alt-minus = 'resize smart -50'
alt-equal = 'resize smart +50'

# == Workspace ==
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-a = 'workspace A'
alt-b = 'workspace B'
alt-d = 'workspace D'
alt-e = 'workspace E'
alt-n = 'workspace N'
alt-s = 'workspace S'
alt-t = 'workspace T'
alt-w = 'workspace W'
alt-z = 'workspace Z'

# == Move to Workpace ==
alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-a = 'move-node-to-workspace A'
alt-shift-b = 'move-node-to-workspace B'
alt-shift-d = 'move-node-to-workspace D'
alt-shift-e = 'move-node-to-workspace E'
alt-shift-n = 'move-node-to-workspace N'
alt-shift-s = 'move-node-to-workspace S'
alt-shift-t = 'move-node-to-workspace T'
alt-shift-w = 'move-node-to-workspace W'
alt-shift-z = 'move-node-to-workspace Z'

# == Windows ==
alt-shift-c = ['close']
alt-shift-ctrl-c = ['close --quit-if-last-window']

# == Fullscreen ==
alt-shift-f = ['fullscreen --no-outer-gaps']
alt-ctrl-f = ['macos-native-fullscreen']

# == Mode Bindings ==
alt-shift-period = [
    'mode application',
    'exec-and-forget sketchybar --trigger aerospace_mode_change MODE=service',
]
alt-shift-semicolon = [
    'mode service',
    'exec-and-forget sketchybar --trigger aerospace_mode_change MODE=service',
]

# -- 'service' binding mode --
[mode.service.binding]
esc = [
    'reload-config',
    'mode main',
    'exec-and-forget sketchybar --trigger aerospace_mode_change MODE=main',
]
r = [
    'flatten-workspace-tree',
    'mode main',
    'exec-and-forget sketchybar --trigger aerospace_mode_change MODE=main',
] # reset layout
f = [
    'layout floating tiling',
    'mode main',
    'exec-and-forget sketchybar --trigger aerospace_mode_change MODE=main',
] # Toggle between floating and tiling layout
backspace = [
    'close-all-windows-but-current',
    'mode main',
    'exec-and-forget sketchybar --trigger aerospace_mode_change MODE=main',
]

alt-shift-h = [
    'join-with left',
    'mode main',
    'exec-and-forget sketchybar --trigger aerospace_mode_change MODE=main',
]
alt-shift-j = [
    'join-with down',
    'mode main',
    'exec-and-forget sketchybar --trigger aerospace_mode_change MODE=main',
]
alt-shift-k = [
    'join-with up',
    'mode main',
    'exec-and-forget sketchybar --trigger aerospace_mode_change MODE=main',
]
alt-shift-l = [
    'join-with right',
    'mode main',
    'exec-and-forget sketchybar --trigger aerospace_mode_change MODE=main',
]

# -- 'application' binding mode --
[mode.application.binding]
d = [
    'exec-and-forget $HOME/.local/bin/new_ghostty',
    'mode main',
    'exec-and-forget sketchybar --trigger aerospace_mode_change MODE=main',
]
b = [
    'exec-and-forget open -a /Applications/Zen.app',
    'mode main',
    'exec-and-forget sketchybar --trigger aerospace_mode_change MODE=main',
]
t = [
    'exec-and-forget open -a /Applications/Todoist.app',
    'mode main',
    'exec-and-forget sketchybar --trigger aerospace_mode_change MODE=main',
]
c = [
    'exec-and-forget open -a /Applications/ChatGPT.app',
    'mode main',
    'exec-and-forget sketchybar --trigger aerospace_mode_change MODE=main',
]
n = [
    'exec-and-forget open -n /Applications/Notion.app',
    'mode main',
    'exec-and-forget sketchybar --trigger aerospace_mode_change MODE=main',
]
v = [
    'exec-and-forget open -n /Applications/Visual Studio Code.app',
    'mode main',
    'exec-and-forget sketchybar --trigger aerospace_mode_change MODE=main',
]
z = [
    'exec-and-forget open -n /Applications/Zed.app',
    'mode main',
    'exec-and-forget sketchybar --trigger aerospace_mode_change MODE=main',
]
s = [
    'exec-and-forget open -a /Applications/Slack.app',
    'mode main',
    'exec-and-forget sketchybar --trigger aerospace_mode_change MODE=main',
]
r = [
    'exec-and-forget open -n /Applications/Raycast.app',
    'mode main',
    'exec-and-forget sketchybar --trigger aerospace_mode_change MODE=main',
]
a = [
    'exec-and-forget open -a /System/Applications/Apps.app',
    'mode main',
    'exec-and-forget sketchybar --trigger aerospace_mode_change MODE=main',
]

# == Window Rules ==
[[on-window-detected]]
if.app-id = "com.mitchellh.ghostty"
check-further-callbacks = true
run = ["layout floating", "move-node-to-workspace D"]

[[on-window-detected]]
if.app-id = "com.zen-browser.zen"
run = ["layout tiling", "move-node-to-workspace B"]

[[on-window-detected]]
if.app-id = "com.apple.finder"
run = ["layout tiling", "move-node-to-workspace E"]

[[on-window-detected]]
if.app-id = "com.TickTick.task.mac"
if.during-aerospace-startup = false
check-further-callbacks = false
run = ["layout floating", "move-node-to-workspace T"]

[[on-window-detected]]
if.app-id = "dev.zed.Ze"
run = ["layout tiling", "move-node-to-workspace Z"]

[[on-window-detected]]
if.app-id = "notion.id"
run = ["layout tiling", "move-node-to-workspace N"]

[[on-window-detected]]
if.app-id = "com.microsoft.rdc.macos"
run = ["layout tiling", "move-node-to-workspace W"]
[[on-window-detected]]
if.app-id = "com.microsoft.rdc.macos"
if.window-title-regex-substring = "Untitled"
run = ["layout floating", "move-node-to-workspace W"]
[[on-window-detected]]
if.app-id = "com.microsoft.rdc.macos"
if.window-title-regex-substring = "SessionDesktop"
run = ["fullscreen --no-outer-gaps", "move-node-to-workspace S"]

[[on-window-detected]]
if.app-id = "com.bitwarden.desktop"
run = ["layout floating"]
[[on-window-detected]]
if.app-id = "com.bitwarden.authenticator"
run = ["layout floating"]

[[on-window-detected]]
if.app-id = "com.github.th-ch.youtube-music"
run = ["move-node-to-workspace 2"]

# AIs
[[on-window-detected]]
if.app-id = "com.anthropic.claudefordesktop"
run = ["move-node-to-workspace A"]
[[on-window-detected]]
if.app-id = "com.openai.chat"
run = ["move-node-to-workspace A"]
[[on-window-detected]]
if.app-id = "com.openai.codex"
run = ["move-node-to-workspace A"]

[[on-window-detected]]
if.app-id = "com.google.Chrome"
run = ["move-node-to-workspace 3"]

[[on-window-detected]]
if.app-id = "com.apple.Notes"
run = ["layout floating"]
