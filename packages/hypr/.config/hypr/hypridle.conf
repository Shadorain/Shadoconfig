$lock_cmd = qs -c sleex ipc call lock lock
$suspend_cmd = hyprctl dispatch "exec systemctl suspend-then-hibernate || loginctl suspend" # systemctl suspend-then-hibernate

general {
    lock_cmd = $lock_cmd
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on  # to avoid having to press a key twice to turn on the display.
    ignore_dbus_inhibit = false             # whether to ignore dbus-sent idle-inhibit requests (used by e.g. firefox or steam)
    # ignore_systemd_inhibit = false          # whether to ignore systemd-inhibit --what=idle
}

listener {
    timeout = 600 # 10 mins
    on-timeout = vigiland -c || { safeeyes -d; loginctl lock-session }
    on-resume = safeeyes -e
}

listener {
    timeout = 660 # 11 mins
    on-timeout = vigiland -c || { safeeyes -d; hyprctl dispatch dpms off }
    on-resume = hyprctl dispatch dpms on; safeeyes -e
}

listener {
    timeout = 900 # 15 mins
    on-timeout = vigiland -c || $suspend_cmd
}
