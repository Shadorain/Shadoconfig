$qs = qs -c sleex

# Hypr
exec-once = pypr # Extra plugins
exec-once = hypridle # Idle listener
exec-once = vigiland # Idle prevention
exec-once = hyprpm reload -n # Start all plugins
exec-once = swww-daemon # For fancy wallpapers
exec-once = $qs -d # Quickshell

# Input method
exec-once = fcitx5
exec-once = hyprctl setcursor Bibata-Modern-Classic 20
exec-once = solaar -w hide # Logitech devices manager

# Local Music
exec-once = mpd
exec-once = sleep 1 && mpd-mpris -port 6600
exec-once = mpris-proxy # Forward bluetooth media commands to MPRIS

# Clipboard history
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Auth
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1 || /usr/libexec/polkit-gnome-authentication-agent-1 # GUI permissions helper

# Misc
exec-once = safeeyes -e

# Misc
exec-once = timeout 15s /usr/local/bin/nvim & # Starts neovim once on startup and closes it after 15 seconds since initial start is longer.

# == Startup Apps == #
# NOTE: Left: 10-18 , Middle: 19-27 , Right: 0-9
exec-once = [workspace 11 silent; fullscreen] $HOME/.local/bin/todo
exec-once = [workspace 12 silent; fullscreen] $HOME/.apps/Capacities-*.AppImage
exec-once = [workspace 0 silent; fullscreen] zen-browser

# Post Start
exec-once = sleep 1 && $qs ipc call lock lock
