# --== Shadorain Hyprland Window Rules ==-- #

windowrulev2 = opacity 0.99 0.99, fullscreen:1

windowrule = float,title:^( - Iced)$
windowrule = float,title:^(Press v)(.*)$
windowrulev2 = float,class:^(press)$
windowrule = float,title:^(Emulator)$
windowrulev2 = opaque,class:^(code)$
windowrulev2 = opaque,class:^(firefox)$
windowrulev2 = opaque,class:^(zen)$
windowrulev2 = opaque,class:^(chrome)(.*)$
windowrulev2 = opaque,class:^(chromium)(.*)$
windowrulev2 = opaque,title:^(Ghost of Tsushima)(.*)$
windowrulev2 = opaque,class:^(Emulator)$

# Flutter Apps
windowrulev2 = opaque,title:^(LyricIn)$
windowrulev2 = opaque,title:^(memento)$
windowrulev2 = float,title:^(memento)$
windowrulev2 = move 2090 65,title:^(memento)$
windowrulev2 = size 400 869,title:^(memento)$
windowrulev2 = workspace 11,title:^(memento)$
windowrulev2 = rounding 56,title:^(memento)$

# Misc Apps
windowrulev2 = float,class:^(waypaper)$
windowrule = float, class:^(blueman-manager)$
windowrule = float, class:org\.gnome\.FileRoller
windowrule = float, class:file-roller
windowrule = float, class:^(xdg-desktop-portal-gtk|xdg-desktop-portal-kde|xdg-desktop-portal-hyprland)(.*)$
windowrule = float, class:^(polkit-gnome-authentication-agent-1|hyprpolkitagent|org.org.kde.polkit-kde-authentication-agent-1)(.*)$
windowrule = float, class:^(CachyOSHello)$
windowrule = float, class:^()$,title:^(Steam - Self Updater)$
windowrule = animation popin, title:^(SafeEyes.*)$
windowrule = float, class:org\.quickshell
windowrule = fullscreenstate 0 3, class:^(chrome-app)$
windowrule = tile, class:^(chrome-app)$

# Tearing
windowrulev2 = immediate, title:.*\.exe
windowrulev2 = immediate, title:.*minecraft.*
windowrulev2 = immediate, class:^(steam_app).*

# == Screensharing == #
windowrulev2 = opacity 0.0 override,class:^(xwaylandvideobridge)$
windowrulev2 = noanim,class:^(xwaylandvideobridge)$
windowrulev2 = noinitialfocus,class:^(xwaylandvideobridge)$
windowrulev2 = maxsize 1 1,class:^(xwaylandvideobridge)$
windowrulev2 = noblur,class:^(xwaylandvideobridge)$

# == Scratchpad == #
windowrulev2 = float,class:kitty,title:ncmpcpp
layerrule = animation slide top, class:kitty,title:ncmpcpp

# == Dialogs == #
windowrule=float,title:^(Open File)(.*)$
windowrule=float,title:^(Select a File)(.*)$
windowrule=float,title:^(Choose wallpaper)(.*)$
windowrule=float,title:^(Open Folder)(.*)$
windowrule=float,title:^(Save As)(.*)$
windowrule=float,title:^(Library)(.*)$

## XWayland Popups
windowrule = nodim, xwayland:1, title:win[0-9]+
windowrule = noshadow, xwayland:1, title:win[0-9]+
windowrule = rounding 10, xwayland:1, title:win[0-9]+

# Picture in picture (resize and move done via script)
windowrulev2 = float, title:^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$
windowrulev2 = keepaspectratio, title:^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$
windowrulev2 = move 73% 72%, title:^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$ 
windowrulev2 = size 25%, title:^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$
windowrulev2 = float, title:^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$
windowrulev2 = pin, title:^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$

# Steam
windowrule = rounding 10, title:, class:steam
windowrule = float, title:Friends List, class:steam
windowrule = immediate, class:steam_app_[0-9]+  # Allow tearing for steam games
windowrule = idleinhibit always, class:steam_app_[0-9]+  # Always idle inhibit when playing a steam game

# == Custom Apps == #

## -- Dioxus -- ##
windowrulev2 = float,title:^(.*dioxus.*)$
windowrulev2 = monitor DP-5,title:^(.*dioxus.*)$
windowrulev2 = noinitialfocus,title:^(.*dioxus.*)$
windowrulev2 = float,title:^(.*Multimedia Compression.*)$
windowrulev2 = monitor DP-5,title:^(.*Multimedia Compression.*)$
windowrulev2 = workspace 2 silent,title:^(.*Multimedia Compression.*)$
windowrulev2 = noinitialfocus,title:^(.*Multimedia Compression.*)$
windowrulev2 = float,title:^(Shadocal.*)$
windowrulev2 = monitor DP-5,title:^(Shadocal.*)$
windowrulev2 = noinitialfocus,title:^(Shadocal.*)$

# == Layers == #
## Layer rules
layerrule = animation fade, hyprpicker  # Colour picker out animation
layerrule = animation fade, logout_dialog  # wlogout
layerrule = animation fade, selection  # slurp
layerrule = animation fade, wayfreeze

# Launcher & Notifications
layerrule = animation popin 80%, launcher
layerrule = blur, launcher
layerrule = ignorealpha 0.5, launcher
layerrule = blur, notifications
layerrule = ignorealpha 0.69, notifications

# Shell
layerrule = blurpopups, quickshell:.*
layerrule = blur, quickshell:.*
layerrule = ignorealpha 0.79, quickshell:.*
layerrule = animation slide, quickshell:bar
layerrule = animation fade, quickshell:screenCorners
layerrule = animation slide right, quickshell:sidebarRight
layerrule = animation slide left, quickshell:sidebarLeft
layerrule = animation slide bottom, quickshell:osk
layerrule = animation slide bottom, quickshell:dock
layerrule = animation slide bottom, quickshell:dashboard
layerrule = animation slide top, quickshell:mediaControls
layerrule = blur, quickshell:session
layerrule = animation slide top, quickshell:session
layerrule = ignorealpha 0, quickshell:session
layerrule = animation fade, quickshell:notificationPopup
layerrule = blur, quickshell:backgroundWidgets
layerrule = ignorealpha 0.05, quickshell:backgroundWidgets
layerrule = animation slide top, quickshell:lockScreen

layerrule = blur, shell:bar
layerrule = ignorezero, shell:bar
layerrule = blur, shell:notifications
layerrule = ignorealpha 0.1, shell:notifications
