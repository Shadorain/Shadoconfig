# --== Shadorain Hyprland Window Rules ==-- #

windowrule = opacity 0.99 0.99, match:fullscreen 1

windowrule = float on, match:title ^( - Iced)$
windowrule = float on, match:title ^(Press v)(.*)$
windowrule = float on, match:class ^(press)$
windowrule = float on, match:title ^(Emulator)$
windowrule = opaque on, match:class ^(code)$
windowrule = opaque on, match:class ^(firefox)$
windowrule = opaque on, match:class ^(zen)$
windowrule = opaque on, match:class ^(chrome)(.*)$
windowrule = opaque on, match:class ^(chromium)(.*)$
windowrule = opaque on, match:title ^(Ghost of Tsushima)(.*)$
windowrule = opaque on, match:class ^(Emulator)$
windowrule = opaque on, match:title ^(BLACK DESERT)(.*)$

# Flutter Apps
windowrule = opaque on, match:title ^(LyricIn)$
windowrule {
    name = memento
    match:title = memento
    opaque = on
    float = on
    move = 2090 65
    size = 400 869
    workspace = 11
    rounding = 56
}

# Misc Apps
windowrule = float on, match:class ^(waypaper)$
windowrule = float on, match:class ^(blueman-manager)$
windowrule = float on, match:class org\.gnome\.FileRoller
windowrule = float on, match:class file-roller
windowrule = float on, match:class ^(xdg-desktop-portal-gtk|xdg-desktop-portal-kde|xdg-desktop-portal-hyprland)(.*)$
windowrule = float on, match:class ^(polkit-gnome-authentication-agent-1|hyprpolkitagent|org.org.kde.polkit-kde-authentication-agent-1)(.*)$
windowrule = float on, match:class ^(CachyOSHello)$
windowrule = float on, match:class ^()$, match:title ^(Steam - Self Updater)$
windowrule = animation popin, match:title ^(SafeEyes.*)$
windowrule = float on, match:class org\.quickshell
windowrule = fullscreen_state 0 3, match:class ^(chrome-app)$
windowrule = tile on, match:class ^(chrome-app)$

# Tearing
windowrule = immediate on, match:title .*\.exe
windowrule = immediate on, match:title .*minecraft.*
windowrule = immediate on, match:class ^(steam_app).*

# == Screensharing == #
windowrule {
    name = Wayland Video Bridge
    match:class = "xwaylandvideobridge"
    opacity = 0.0
    no_anim = true
    no_initial_focus = true
    no_blur = true
    max_size = 1 1
}

# == Scratchpad == #
windowrule = float on, match:class kitty, match:title ncmpcpp
layerrule = animation slide top, match:class kitty, match:title ncmpcpp

# == Dialogs == #
windowrule = float on, match:title ^(Open File)(.*)$
windowrule = float on, match:title ^(Select a File)(.*)$
windowrule = float on, match:title ^(Choose wallpaper)(.*)$
windowrule = float on, match:title ^(Open Folder)(.*)$
windowrule = float on, match:title ^(Save As)(.*)$
windowrule = float on, match:title ^(Library)(.*)$

## XWayland Popups
windowrule = no_dim on, match:xwayland 1, match:title win[0-9]+
windowrule = no_shadow on, match:xwayland 1, match:title win[0-9]+
windowrule = rounding 10, match:xwayland 1, match:title win[0-9]+

# Picture in picture (resize and move done via script)
windowrule = float on, match:title ^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture).*
windowrule = keep_aspect_ratio on, match:title ^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture).*
windowrule = move 73% 72%, match:title ^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture).*
windowrule = size 25% 0%, match:title ^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture).*
windowrule = pin on, match:title ^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture).*

# Steam
windowrule = rounding 10, match:class steam
windowrule = float on, match:title Friends List, match:class steam
windowrule = immediate on, match:class steam_app_[0-9]+  # Allow tearing for steam games
windowrule = idle_inhibit always, match:class steam_app_[0-9]+  # Always idle inhibit when playing a steam game

# == Custom Apps == #

## -- Dioxus -- ##
windowrule = float on, match:title ^(.*dioxus.*)$
windowrule = monitor DP-4, match:title ^(.*dioxus.*)$
windowrule = no_initial_focus on, match:title ^(.*dioxus.*)$

windowrule = float on, match:title ^(.*Multimedia Compression.*)$
windowrule = monitor DP-4, match:title ^(.*Multimedia Compression.*)$
windowrule = workspace 2 silent, match:title ^(.*Multimedia Compression.*)$
windowrule = no_initial_focus on, match:title ^(.*Multimedia Compression.*)$

windowrule = float on, match:title ^(Shadocal.*)$
windowrule = monitor DP-4, match:title ^(Shadocal.*)$
windowrule = no_initial_focus on, match:title ^(Shadocal.*)$

# == Layers == #
## Layer rules
layerrule = animation fade, match:namespace hyprpicker  # Colour picker out animation
layerrule = animation fade, match:namespace logout_dialog  # wlogout
layerrule = animation fade, match:namespace selection  # slurp
layerrule = animation fade, match:namespace wayfreeze

# Launcher & Notifications
layerrule {
    name = launcher
    blur = on
    animation = popin 80%
    ignore_alpha = 0.5
}
layerrule {
    name = notifications
    blur = on
    ignore_alpha = 0.69
}

# Shell
layerrule = blur_popups on, match:namespace quickshell:.*
layerrule = blur on, match:namespace quickshell:.*
layerrule = ignore_alpha 0.79, match:namespace quickshell:.*
layerrule = animation slide, match:namespace quickshell:bar
layerrule = animation fade, match:namespace quickshell:screenCorners
layerrule = animation slide right, match:namespace quickshell:sidebarRight
layerrule = animation slide left, match:namespace quickshell:sidebarLeft
layerrule = animation slide bottom, match:namespace quickshell:osk
layerrule = animation slide bottom, match:namespace quickshell:dock
layerrule = animation slide bottom, match:namespace quickshell:dashboard
layerrule = animation slide top, match:namespace quickshell:mediaControls
layerrule = blur on, match:namespace quickshell:session
layerrule = animation slide top, match:namespace quickshell:session
layerrule = ignore_alpha 0, match:namespace quickshell:session
layerrule = animation fade, match:namespace quickshell:notificationPopup
layerrule = blur on, match:namespace quickshell:backgroundWidgets
layerrule = ignore_alpha 0.05, match:namespace quickshell:backgroundWidgets
layerrule = animation slide top, match:namespace quickshell:lockScreen

layerrule = blur on, match:namespace shell:bar
layerrule = blur on, match:namespace shell:notifications
layerrule = ignore_alpha 0.1, match:namespace shell:notifications
