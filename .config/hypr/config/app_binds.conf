# Lines ending with `# [hidden]` won't be shown on cheatsheet
# Lines starting with #! are section headings

# Configuration Variables
$term = kitty
$browser = zen-browser
$chrome = chromium --new-window
$toggleVigiland = bash -c "if pidof vigiland &> /dev/null; then kill -SIGINT $(pidof vigiland); notify-send 'Vigiland' 'Stopping vigiland'; exit; else vigiland && notify-send 'Vigiland' 'Vigiland started!'; fi"
$qs = qs -c sleex
$ipc = $qs ipc call

#! Shell keybinds
##! Launcher
bindid = $mod2, $mod2_L, Toggle overview, global, quickshell:overviewToggleRelease # Toggle overview/launcher
bind = $mod2, $mod2_L, exec, $qs ipc call TEST_ALIVE || pkill fuzzel || fuzzel # [hidden] Launcher (fallback)
binditn = $mod2, catchall, global, quickshell:overviewToggleReleaseInterrupt # [hidden]
bind = Ctrl, $mod2_L, global, quickshell:overviewToggleReleaseInterrupt # [hidden]
bind = $mod2, mouse:272, global, quickshell:overviewToggleReleaseInterrupt # [hidden]
bind = $mod2, mouse:273, global, quickshell:overviewToggleReleaseInterrupt # [hidden]
bind = $mod2, mouse:274, global, quickshell:overviewToggleReleaseInterrupt # [hidden]
bind = $mod2, mouse:275, global, quickshell:overviewToggleReleaseInterrupt # [hidden]
bind = $mod2, mouse:276, global, quickshell:overviewToggleReleaseInterrupt # [hidden]
bind = $mod2, mouse:277, global, quickshell:overviewToggleReleaseInterrupt # [hidden]
bind = $mod2, mouse_up,  global, quickshell:overviewToggleReleaseInterrupt # [hidden]
bind = $mod2, mouse_down,global, quickshell:overviewToggleReleaseInterrupt # [hidden]
bindit = ,$mod2_L, global, quickshell:workspaceNumber # [hidden]
bindit = ,$mod_L, global, quickshell:workspaceNumber # [hidden]
##! Features
bindd = $mod2, V, Clipboard history, global, quickshell:overviewClipboardToggle
bindd = $mod2, Period, Emoji picker, global, quickshell:overviewEmojiToggle
bindd = $mod2, A, Toggle left sidebar, global, quickshell:sidebarLeftToggle
bindd = $mod $mod2, A, Detach sidebar, global, quickshell:sidebarLeftToggleDetach
bindd = $mod2, D, Toggle dashboard, global, quickshell:dashboardToggle
bindd = $mod2, Slash, Toggle cheatsheet, global, quickshell:cheatsheetToggle
bindd = $mod2, M, Toggle media controls, global, quickshell:mediaControlsToggle
bindd = $mod Ctrl, Delete, Toggle session menu, global, quickshell:sessionToggle
bindd = $mod2 Shift, s, Toggle session menu, global, quickshell:sessionToggle
bindd = $mod2, J, Toggle bar, global, quickshell:barToggle
##! Session
bindd = $mod2, l, Lock, exec, loginctl lock-session
bind = $mod2 Ctrl, l, exec, loginctl lock-session # [hidden]
bindld = $mod2 Ctrl, l, Suspend system, exec, sleep 0.1 && systemctl suspend || loginctl suspend
bindd = $mod $mod2 Ctrl Shift, Delete, Shutdown, exec, systemctl poweroff || loginctl poweroff
##! Misc
bindrd = $mod2 Ctrl Alt, R, Restart shell, exec, $qs kill; $qs -d
bindrd = $mod2 Ctrl Alt, K, Kill shell, exec, $qs kill
bindd = $mod2, L, Lock session, global, loginctl lock-session
### Restore lock
bindl = $mod $mod2, L, exec, $qs
bindl = $mod $mod2, L, global, loginctl lock-session


#! Applications
##! General
bindd = $mod Shift, Return, Open terminal, exec, $term
bindd = $mod2, b, Open browser, exec, $browser
bindd = $mod2, e, Open file explorer, exec, spacedrive
# ## Pyrpland
# bind = $mod Shift, s, exec, pypr toggle ncmpcpp
# bind = $mod Shift, t, exec, pypr toggle term
##! Misc
bindd = $mod Shift, s, Music player, exec, pkill ncmpcpp || kitty -1 ncmpcpp
bindd = Ctrl Shift, Escape, Task manager, exec, kitty -1 btop
bindd = $mod2 Shift, v, Keep screen alive, exec, $toggleVigiland
bindd = $mod2 Shift, c, Color picker, exec, hyprpicker -a
bindd = $mod2, F1, Start gamemode, exec, $HOME/.config/hypr/gamemode.sh
bindde = $mod2 Shift, Minus, Zoom out -0.1, exec, $bin/zoom.sh decrease 0.1
bindde = $mod2 Shift, Equal, Zoom in +0.1, exec, $bin/zoom.sh increase 0.1
bindd = $mod Ctrl, f, Floating size window, resizeactive, exact 1200 680
##! Productivity
bindd = $mod2 Shift, e, Opens NeoVim Editor, exec, kitty -1 nvim
bindd = $mod2 Shift, d, Opens VScode Editor, exec, code
bindd = $mod2 Shift, y, Opens YouTube Music, exec, youtube-music
bindd = $mod2 Shift, a, Opens Capacities, exec, $HOME/.apps/Capacities-*.AppImage
bindd = $mod2 Shift, t, Opens Todoist, exec, $bin/todo
bindd = $mod2 Shift, n, Opens Notion, exec, notion-app
bindd = $mod2 Ctrl Shift, n, Opens Obsidian, exec, $bin/obsidian
# bindd = $mod2 Shift, t, Opens Tana, exec, $chrome --app=https://app.tana.inc
bindd = $mod2 Shift, b, Opens Cashew Budgetting, exec, $chrome --app=https://budget-track.web.app/
bindd = $mod2 Shift, m, Opens Google Messages, exec, $chrome --app=https://messages.google.com/web/conversations
bindd = $mod2 Shift, 0, Opens Robinhood Legend, exec, $chrome --app=https://robinhood.com/legend
bindd = $mod2 Ctrl, d, Opens Discord, exec, discord
bindd = $mod2 Ctrl, p, Opens Proxmox Server, exec, $browser -new-window "https://192.168.1.211:8006"
# ##! Fuzzel
# bindd = $mod2, v, Clipboard history, exec, pkill fuzzel || cliphist list | fuzzel  --match-mode fzf --dmenu | cliphist decode | wl-copy
# bindd = $mod2, Period, Emoji picker menu, exec, pkill fuzzel || $bin/fuzzel-emoji.sh
## -- Notifications -- ##
# bind = $mod, n, exec, swaync-client -t -sw # Toggle Window
# bind = $mod Ctrl, n, exec, swaync-client -d # Do not Disturb
# bind = $mod Shift, n, exec, swaync-client -C # Close all
# bind = $mod Ctrl Shift, n, exec, killall swaync && swaync & # swaync-client -R -rs # Reload


#! Screen
##! Screenshot
bindd = , Print, Screenshot Monitor, exec, $bin/scr monitor
bindd = Ctrl Shift, Print, Screenshot Area, exec, $bin/scr area
bindd = Shift, Print, Screenshot Area with Annotations, exec, $bin/scr area-annotate
bindd = $mod Ctrl, Print, Screenshot Area with Annotations (5 Sec delay), exec, $bin/scr area-annotate-delay
bindd = $mod Shift, Print, Screenshot Extract Text, exec, $bin/scr extract
##! Screen Record
bindd = $mod2, Print, Record Screen, exec, $bin/scr screenrec
bindd = $mod2 Shift, Print, Record Screen with Audio, exec, $bin/scr screenrec-audio
##! AI
bindd = $mod $mod2 SHIFT, mouse:273, Generate AI summary for selected text, exec, $bin/primary-buffer-query.sh
##! Screen modification
bindd = $mod2 Shift, l, Toggle Sunset mode, exec, $bin/sunset # Night time screen mode
bindld = $mod2 Shift, p, Toggle DPMS (Screen On/OFF), exec, hyprctl dispatch dpms toggle # Toggle on/off screen


#! Media
##! Local Media
bindld = Ctrl, XF86AudioNext, Next song local media, exec, mpc next
bindld = Ctrl, XF86AudioPrev, Prev song local media, exec, mpc prev
bindld = Ctrl, XF86AudioPlay, Play/pause local media, exec, mpc toggle
bindld = Ctrl, XF86AudioStop, Stop local media, exec, mpc stop
##! Streaming Media
bindld = , XF86AudioPlay, Play/Pause media, exec, playerctl play-pause
bindld = , XF86AudioPause, Play/Pause media, exec, playerctl play-pause
bindld = , XF86AudioNext, Next media, exec, playerctl next
bindld = , XF86AudioPrev, Prev media, exec, playerctl previous
bindld = , XF86AudioStop, Stop media, exec, playerctl stop
bindld = $mod2, Space, Play/Pause media, exec, playerctl play-pause
bindld = $mod2, Equal, Next media, exec, playerctl next
bindld = $mod2, Minus, Prev media, exec, playerctl previous
##! Volume Control
bindld = , XF86AudioRaiseVolume, Raise Volume, exec, pulsemixer --change-volume +2
bindld = , XF86AudioLowerVolume, Decrease Volume, exec, pulsemixer --change-volume -2
bindld = , XF86AudioMute, Mute volume, exec, pulsemixer --toggle-mute
bindld = Ctrl, XF86AudioMute, Mute microphone, exec, pulsemixer --toggle-mute --id source-64
##! Brightness Control
bindld = Ctrl, XF86AudioRaiseVolume, Raise Brightness, global, quickshell:brightnessIncrease
bindld = Ctrl, XF86AudioLowerVolume, Decrease Brightness, global, quickshell:brightnessDecrease
